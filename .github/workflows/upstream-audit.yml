name: Check GKD upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch upstream subscription
        run: curl -fL --retry 3 'https://gkd-subscription-667.pages.dev/gkd.json5' -o upstream.json5
      - name: Install JSON5 parser
        run: npm install --no-save json5
      - name: Validate and audit
        run: node audit/audit.mjs
      - name: Commit upstream changes and report
        run: |
          if ! git diff --quiet -- upstream.json5 audit/REPORT.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add upstream.json5 audit/REPORT.md
            git commit -m 'chore: update upstream snapshot and audit report'
            git push
          fi
